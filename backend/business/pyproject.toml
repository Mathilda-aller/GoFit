[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gofit-business"
version = "0.1.0"
description = "GoFit hackathon MVP business center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
