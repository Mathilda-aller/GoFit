services:
  gofit-business:
    image: ${DOCKERHUB_USERNAME:-muxinji}/gofit-business:latest
    container_name: gofit-business
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - GOFIT_STORAGE_DIR=/app/storage
      - GOFIT_AI_CENTER_URL=http://gofit-ai:8100
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  gofit-ai:
    image: ${DOCKERHUB_USERNAME:-muxinji}/gofit-ai:latest
    container_name: gofit-ai
    ports:
      - "8100:8100"
    environment:
      - ENV=production
      - GOFIT_MEDIA_OUTPUT_DIR=/app/storage/ai-generated
      - GOFIT_FFMPEG_PATH=ffmpeg
      - GOFIT_FFPROBE_PATH=ffprobe
      # 真实模型配置（留空则使用固定假模型）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - GOFIT_ASR_MODEL=${GOFIT_ASR_MODEL:-qwen3-asr-flash}
      - GOFIT_OCR_MODEL=${GOFIT_OCR_MODEL:-}
      - GOFIT_VISION_MODEL=${GOFIT_VISION_MODEL:-}
      - GOFIT_ACTION_CARD_MODEL=${GOFIT_ACTION_CARD_MODEL:-}
      - GOFIT_ACTION_CARD_PROVIDER=${GOFIT_ACTION_CARD_PROVIDER:-dashscope}
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  gofit-frontend:
    image: ${DOCKERHUB_USERNAME:-muxinji}/gofit-frontend:latest
    container_name: gofit-frontend
    ports:
      - "80:80"
    environment:
      - VITE_BUSINESS_API_URL=/api/v1
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # 本地开发可选的 PostgreSQL，生产环境如需要可取消 profiles 注释
  database:
    image: postgres:16-alpine
    profiles: ["optional-postgres"]
    environment:
      POSTGRES_DB: gofit
      POSTGRES_USER: gofit
      POSTGRES_PASSWORD: gofit_dev_only
    ports:
      - "5432:5432"
    volumes:
      - gofit_postgres_data:/var/lib/postgresql/data

volumes:
  gofit_postgres_data:
